[package]
name = "ebs-orphan-bill"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["PEPAI <pep_ai@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Offline EBS orphan cost from describe-volumes and describe-snapshots JSON"
readme = "README.md"
repository = "https://github.com/qwpp7g79y4-maker/ebs-orphan-bill"
homepage = "https://www.pepai.nl"
documentation = "https://github.com/qwpp7g79y4-maker/ebs-orphan-bill"
keywords = ["aws", "ebs", "cost", "cli"]
exclude = ["*-plugin/"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ebs_orphan_bill"
path = "src/lib.rs"

[[bin]]
name = "ebs-orphan-bill"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
rust_decimal = "1.43.0"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }

[dev-dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
rust_decimal = "1.43.0"
